version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: resumeforge-mysql
    restart: always
    environment:
      MYSQL_DATABASE: resumeforge
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/sample_data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql
    networks:
      - resumeforge-net

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: resumeforge-backend
    restart: always
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/resumeforge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    networks:
      - resumeforge-net

volumes:
  mysql_data:

networks:
  resumeforge-net:
    driver: bridge
